# ติด tag v* (เช่น git tag v1.0.0 && git push --tags) แล้ว build TeewangBambu.exe บน Windows ของ GitHub แนบใน Releases
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "paho-mqtt==2.1.0" "pyinstaller==6.11.1"
      - run: pyinstaller --onefile --console --name TeewangBambu bambu_app.py
      - run: dist\TeewangBambu.exe --check
      - uses: actions/upload-artifact@v4
        with:
          name: TeewangBambu
          path: dist/TeewangBambu.exe
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} dist/TeewangBambu.exe --title ${{ github.ref_name }} --notes "TeewangBambu.exe สำหรับ Windows"
        env:
          GH_TOKEN: ${{ github.token }}
